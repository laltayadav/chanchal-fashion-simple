<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A2438"/>
      <stop offset="100%" stop-color="#3E1220"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="1" y="1" width="118" height="138" rx="10" fill="#FBF5EA"/>

  <!-- finial above the arch -->
  <line x1="60" y1="10" x2="60" y2="22" stroke="#3E1220" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="8" r="3.2" fill="#C6963A" stroke="#3E1220" stroke-width="1"/>

  <!-- left vine + flower, outside the arch -->
  <path d="M18 62 C10 66 8 74 12 80 C15 84 20 82 20 77" fill="none" stroke="#C6963A" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M14 92 C9 90 7 84 11 80" fill="none" stroke="#C6963A" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="10" cy="78" r="6" fill="#7A2438"/>
  <circle cx="10" cy="78" r="2.4" fill="#C6963A"/>
  <circle cx="15" cy="92" r="3" fill="#5C1A2B"/>

  <!-- right vine + flower, mirrored -->
  <path d="M102 62 C110 66 112 74 108 80 C105 84 100 82 100 77" fill="none" stroke="#C6963A" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M106 92 C111 90 113 84 109 80" fill="none" stroke="#C6963A" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="110" cy="78" r="6" fill="#7A2438"/>
  <circle cx="110" cy="78" r="2.4" fill="#C6963A"/>
  <circle cx="105" cy="92" r="3" fill="#5C1A2B"/>

  <!-- arch -->
  <path d="M22 98 L22 60 A38 38 0 0 1 98 60 L98 98 Z" fill="#3E1220"/>
  <path d="M22 98 L22 60 A38 38 0 0 1 98 60 L98 98" fill="none" stroke="#C6963A" stroke-width="2"/>
  <path d="M27 96 L27 61 A33 33 0 0 1 93 61 L93 96" fill="none" stroke="#C6963A" stroke-width="0.7" opacity="0.6"/>

  <!-- dress: bodice -->
  <path d="
    M46 40
    C 50 36 55 37 60 39
    C 65 37 70 36 74 40
    L 69 51
    L 63 65
    L 57 65
    L 51 51
    Z"
    fill="#FBF5EA"/>
  <path d="M52 44 L68 59" stroke="#C6963A" stroke-width="1.1"/>
  <path d="M68 44 L52 59" stroke="#C6963A" stroke-width="1.1"/>

  <!-- dress: skirt -->
  <path d="
    M57 65 L63 65
    C 73 73 82 83 86 95
    L 34 95
    C 38 83 47 73 57 65
    Z"
    fill="url(#skirtGrad)"/>
  <path d="M60 65 L60 95" stroke="#3E1220" stroke-width="0.8" opacity="0.5"/>
  <path d="M55 66 L47 94" stroke="#3E1220" stroke-width="0.8" opacity="0.5"/>
  <path d="M65 66 L73 94" stroke="#3E1220" stroke-width="0.8" opacity="0.5"/>
  <path d="M50 68 L40 94" stroke="#3E1220" stroke-width="0.6" opacity="0.35"/>
  <path d="M70 68 L80 94" stroke="#3E1220" stroke-width="0.6" opacity="0.35"/>

  <!-- waist flower -->
  <circle cx="60" cy="65" r="5" fill="#C6963A"/>
  <circle cx="60" cy="65" r="2" fill="#FBF5EA"/>
</svg>
